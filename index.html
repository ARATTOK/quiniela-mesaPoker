<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiniela Mundial</title>
</head>
<body>
    <h1>Bienvenido a la Quiniela</h1>
    <div id="login-form">
        <input type="email" id="email" placeholder="Correo">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Entrar</button>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        
        const SUPABASE_URL = 'https://gvoadjrnrlzhgeqsdhyi.supabase.co'
        const SUPABASE_KEY = 'sb_publishable_XiqzVY4Sh3VTQsqGEu6eHA_akxwyJZK'
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

        window.login = async () => {
            const emailInput = document.getElementById('email').value.trim()
            const password = document.getElementById('password').value
            
            if (!emailInput || !password) return alert('Por favor, completa todos los campos')

            // Diccionario de 13 usuarios predefinidos
            const usersMap = {
                'admin': 'MesaPokerAdmin2024!',
                'jugador1': 'poker01',
                'jugador2': 'poker02',
                'jugador3': 'poker03',
                'jugador4': 'poker04',
                'jugador5': 'poker05',
                'jugador6': 'poker06',
                'jugador7': 'poker07',
                'jugador8': 'poker08',
                'jugador9': 'poker09',
                'jugador10': 'poker10',
                'jugador11': 'poker11',
                'jugador12': 'poker12'
            }

            // Verificación en lista local
            if (usersMap[emailInput] && usersMap[emailInput] === password) {
                localStorage.setItem('currentUser', emailInput)
                if (emailInput === 'admin') {
                    localStorage.setItem('adminSession', 'true')
                    window.location.href = 'admin.html'
                } else {
                    localStorage.setItem('adminSession', 'false')
                    window.location.href = 'pronosticos.html'
                }
                return
            }

            // Login normal con Supabase para otros usuarios
            const { data, error } = await supabase.auth.signInWithPassword({ email: emailInput, password })
            
            if (error) alert(error.message)
            else {
                window.location.href = 'pronosticos.html'
            }
        }
    </script>
</body>
</html>
