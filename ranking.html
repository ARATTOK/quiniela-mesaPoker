<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela - Ranking</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤡</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-200 min-h-screen">
    <div class="navbar bg-base-100 shadow-lg px-4 lg:px-20">
        <div class="flex-1"><a href="index.html" class="text-xl font-bold text-primary">🏆 Quiniela</a></div>
        <div class="flex-none flex items-center gap-2">
            <ul class="menu menu-horizontal px-1 gap-2">
                <li><a href="pronosticos.html">Pronósticos</a></li>
                <li><a href="ranking.html" class="active">Ranking</a></li>
                <li><a href="reglamento.html">Reglamento</a></li>
            </ul>
            <div class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="btn btn-ghost btn-sm italic opacity-70 lowercase">
                    <span id="user-display"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 opacity-50">
                        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
                    </svg>
                </div>
                <ul tabindex="0" class="dropdown-content z-[1] menu p-2 shadow bg-base-100 rounded-box w-52 mt-4">
                    <li><button onclick="logout()" class="text-error font-bold text-left">Cerrar Sesión</button></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="container mx-auto p-4 lg:p-10">
        <h1 class="text-3xl font-bold mb-8 border-l-4 border-secondary pl-4">Tabla de Posiciones</h1>
        <div class="overflow-x-auto card bg-base-100 shadow-xl p-4">
            <table class="table table-zebra w-full" id="ranking-table">
                <thead class="text-secondary uppercase text-xs">
                    <tr class="border-b border-base-300">
                        <th class="w-16 text-center">#</th>
                        <th>Usuario</th>
                        <th class="text-center">Exactos</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Aquí se cargarán los datos del ranking -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const supabase = createClient('https://gvoadjrnrlzhgeqsdhyi.supabase.co', 'sb_publishable_XiqzVY4Sh3VTQsqGEu6eHA_akxwyJZK')

        // Verificar sesión al cargar
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            window.location.href = 'index.html'
        } else {
            document.getElementById('user-display').innerText = currentUser;
        }

        const flags = {
            'Argentina': '🇦🇷', 'Brasil': '🇧🇷', 'Uruguay': '🇺🇾', 'Colombia': '🇨🇴',
            'Chile': '🇨🇱', 'Perú': '🇵🇪', 'Ecuador': '🇪🇨', 'Paraguay': '🇵🇾',
            'Venezuela': '🇻🇪', 'Bolivia': '🇧🇴', 'México': '🇲🇽', 'USA': '🇺🇸',
            'Estados Unidos': '🇺🇸', 'EE. UU.': '🇺🇸', 'Canadá': '🇨🇦', 'España': '🇪🇸', 'Francia': '🇫🇷',
            'Alemania': '🇩🇪', 'Italia': '🇮🇹', 'Inglaterra': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'Portugal': '🇵🇹',
            'Holanda': '🇳🇱', 'Países Bajos': '🇳🇱', 'Bélgica': '🇧🇪', 'Croacia': '🇭🇷', 'Suiza': '🇨🇭',
            'Dinamarca': '🇩🇰', 'Serbia': '🇷🇸', 'Polonia': '🇵🇱', 'Escocia': '🏴󠁧󠁢󠁳󠁣󠁴󠁿', 'Ucrania': '🇺🇦',
            'Turquía': '🇹🇷', 'Marruecos': '🇲🇦', 'Argelia': '🇩🇿', 'Egipto': '🇪🇬', 'Nigeria': '🇳🇬',
            'Camerún': '🇨🇲', 'Ghana': '🇬🇭', 'Costa de Marfil': '🇨🇮', 'Senegal': '🇸🇳', 'Japón': '🇯🇵',
            'Corea del Sur': '🇰🇷', 'República de Corea': '🇰🇷', 'Australia': '🇦🇺', 'Arabia Saudita': '🇸🇦', 
            'Arabia Saudí': '🇸🇦', 'Irán': '🇮🇷', 'RI de Irán': '🇮🇷', 'Qatar': '🇶🇦', 'Catar': '🇶🇦',
            'Costa Rica': '🇨🇷', 'Panamá': '🇵🇦', 'Jamaica': '🇯🇲', 'Sudáfrica': '🇿🇦',
            'Chequia': '🇨🇿', 'Bosnia y Herzegovina': '🇧🇦', 'Haití': '🇭🇹', 'Curazao': '🇨🇼',
            'Suecia': '🇸🇪', 'Túnez': '🇹🇳', 'Nueva Zelanda': '🇳🇿', 'Islas de Cabo Verde': '🇨🇻', 'Cabo Verde': '🇨🇻',
            'Irak': '🇮🇶', 'Noruega': '🇳🇴', 'Austria': '�🇹', 'Jordania': '🇯🇴', 'RD Congo': '🇨🇩',
            'RD del Congo': '🇨🇩',
            'Uzbekistán': '🇺🇿'
        };

        const getFlag = (team) => `${flags[team] || ''} ${team}`;

        async function cargarRanking() {
            const { data: ranking, error } = await supabase
                .from('ranking_view') // Nombre de la vista que creaste en SQL
                .select('*')
            
            if (error) return console.error('Error al cargar el ranking:', error.message)

            const tbody = document.querySelector('#ranking-table tbody')
            ranking.forEach((player, index) => {
                const row = tbody.insertRow()
                row.innerHTML = `
                    <th class="text-center font-bold">${index + 1}</th>
                    <td>
                        <div class="tooltip tooltip-right" data-tip="${player.username}">
                            <div class="font-bold whitespace-normal text-left leading-tight">${getFlag(player.username)}</div>
                        </div>
                    </td>
                    <td class="text-center"><div class="badge badge-ghost">${player.exact_scores || 0}</div></td>
                    <td><div class="badge badge-secondary font-bold">${player.total_points} pts</div></td>
                `
            })
        }

        window.logout = async () => {
            await supabase.auth.signOut()
            localStorage.clear()
            window.location.href = 'index.html'
        }

        cargarRanking()
    </script>
</body>
</html>
