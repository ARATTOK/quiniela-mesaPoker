        @keyframes shine {
            to { background-position: 200% center; }
        }
        .metallic-row {
            background-size: 200% auto;
            animation: shine 5s linear infinite;
            transition: transform 0.2s;
        }
        .metallic-row:hover { transform: scale(1.01); }
        
        /* Oro */
        .rank-1 {
            background-image: linear-gradient(110deg, #fdf6e3 0%, #f5d142 20%, #fdf6e3 40%, #f5d142 60%, #fdf6e3 80%, #f5d142 100%);
            color: #7a5100 !important;
        }
        /* Plata */
        
        /* Animación para el avatar del líder */
        @keyframes avatar-glow {
            0% { box-shadow: 0 0 0px 0px rgba(255, 215, 0, 0.7); }
            50% { box-shadow: 0 0 15px 5px rgba(255, 215, 0, 0.9); }
            100% { box-shadow: 0 0 0px 0px rgba(255, 215, 0, 0.7); }
        }
        .leader-avatar-shine {
            animation: avatar-glow 2s infinite ease-in-out;
        }
        .rank-2 {
            background-image: linear-gradient(110deg, #f8fafc 0%, #cbd5e1 20%, #f8fafc 40%, #cbd5e1 60%, #f8fafc 80%, #cbd5e1 100%);
            color: #334155 !important;

        /* Bronce */

            background-image: linear-gradient(110deg, #fff7ed 0%, #d97706 20%, #fff7ed 40%, #d97706 60%, #fff7ed 80%, #d97706 100%);
            color: #78350f !important;
        }

            'Uzbekistán': '🇺🇿'
        };

        const initTheme = () => {
            const themeToggle = document.getElementById('theme-toggle');
            const currentTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            if (themeToggle) {
                themeToggle.checked = currentTheme === 'light';
                themeToggle.onchange = () => {
                    const newTheme = themeToggle.checked ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                };
            }
        };

        const getFlag = (team) => `${flags[team] || ''} ${team}`;

        let fullRankingData = [];

        window.applyFilters = () => {
            const showOnlyExacts = document.getElementById('filter-exacts').checked;
            const filteredData = showOnlyExacts 
                ? fullRankingData.filter(p => (p.exact_scores || 0) > 0)
                : fullRankingData;
            renderRanking(filteredData);
        };

        function renderRanking(data) {
            const tbody = document.querySelector('#ranking-table tbody');
            tbody.innerHTML = '';

            data.forEach((player, index) => {
                const row = tbody.insertRow();
                const isTop3 = index < 3;
                
                if (isTop3) {
                    row.className = `metallic-row rank-${index + 1} font-black`;
                }

                const medalEmoji = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : (index + 1);
                const totalPoints = player.total_points || 0;
                const exactScores = player.exact_scores || 0;
                const otherPoints = Math.max(0, totalPoints - (exactScores * 12));
                const config = userConfig[player.username] || { emoji: '👤', color: 'ring-primary' };
                const avatarShineClass = index === 0 ? 'leader-avatar-shine' : ''; // Aplica solo al líder

                row.innerHTML = `
                    <th class="text-center ${isTop3 ? 'text-2xl' : 'opacity-50'}">${medalEmoji}</th>
                    <td>
                        <div class="flex items-center gap-4">
                            <div class="avatar placeholder">
                                <div class="bg-neutral text-neutral-content rounded-full w-8 sm:w-10 ring ${config.color} ring-offset-base-100 ring-offset-1 ${avatarShineClass}">
                                    <span class="text-lg">${config.emoji}</span>
                                </div>
                            </div>
                            <div>
                                <div class="${isTop3 ? 'text-lg' : 'font-bold'} capitalize">${player.username}</div>
                                <div class="text-[10px] opacity-50 uppercase tracking-tighter">Participante Activo</div>
                            </div>
                        </div>
                    </td>
                    <td class="text-center">
                        <div class="badge ${exactScores > 0 ? 'badge-success' : 'badge-ghost opacity-30'} font-bold">🎯 ${exactScores}</div>
                    </td>
                    <td class="text-center">
                        <div class="text-xs opacity-70">${otherPoints} pts</div>
                    </td>
                    <td class="text-right pr-8">
                        <div class="text-xl font-black">${totalPoints}</div>
                    </td>
                `;
            });
        }

        async function cargarRanking() {
            const { data: ranking, error } = await supabase
                .from('ranking_view') // Nombre de la vista que creaste en SQL
                .select('*')
            
            if (error) return console.error('Error al cargar el ranking:', error.message)
            
            fullRankingData = ranking.sort((a, b) => b.total_points - a.total_points);
            renderRanking(fullRankingData);
        }

        window.logout = async () => {
            await supabase.auth.signOut()
            localStorage.clear()
            window.location.href = 'index.html'
        }

        const circusSounds = [
            'https://assets.mixkit.co/active_storage/sfx/611/611-preview.mp3',
            'https://assets.mixkit.co/active_storage/sfx/607/607-preview.mp3',
            'https://assets.mixkit.co/active_storage/sfx/608/608-preview.mp3'
        ].map(src => {
            const audio = new Audio(src);
            audio.load();
            return audio;
        });

        window.playHorn = () => {
            const randomHorn = circusSounds[Math.floor(Math.random() * circusSounds.length)];
            randomHorn.currentTime = 0;
            randomHorn.playbackRate = 0.8 + Math.random() * 0.7;
            randomHorn.play();

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { x: 0.1, y: 0.1 },
                    colors: ['#ef4444', '#f5d142', '#3b82f6', '#10b981', '#a855f7']
                });
            }
        }
