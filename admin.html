<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Quiniela</title>
    <style>
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Panel de Control del Admin</h1>
    
    <section class="admin-section">
        <h2>Crear Nuevo Partido</h2>
        <div class="card">
            <div class="admin-form-group">
                <label for="new-home">Equipo Local:</label>
                <input type="text" id="new-home" placeholder="Ej: Argentina">
            </div>
            <div class="admin-form-group">
                <label for="new-away">Equipo Visitante:</label>
                <input type="text" id="new-away" placeholder="Ej: Brasil">
            </div>
            <div class="admin-form-group">
                <label for="new-stage">Fase:</label>
                <select id="new-stage">
                    <option value="Grupos">Grupos</option>
                    <option value="Octavos">Octavos</option>
                    <option value="Cuartos">Cuartos</option>
                    <option value="Semis">Semis</option>
                    <option value="Final">Final</option>
                </select>
            </div>
            <div class="admin-form-group">
                <label for="new-date">Fecha y Hora:</label>
                <input type="datetime-local" id="new-date">
            </div>
            <button onclick="crearPartido()">Agregar Partido</button> <button class="btn-secondary" onclick="limpiarFormularioPartido()">Limpiar</button>
        </div>
    </section>

    <div id="admin-matches">Cargando partidos...</div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        // Credenciales integradas
        const SUPABASE_URL = 'https://gvoadjrnrlzhgeqsdhyi.supabase.co'
        const SUPABASE_KEY = 'sb_publishable_XiqzVY4Sh3VTQsqGEu6eHA_akxwyJZK'
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

        // 1. Verificación de seguridad
        async function checkAdmin() {
            const isAdminSession = localStorage.getItem('adminSession') === 'true'
            const { data: { user } } = await supabase.auth.getUser()
            
            // Permite el acceso si es la sesión manual de admin o el correo específico en Supabase
            if (isAdminSession || (user && user.email === 'dario.aratto@gmail.com')) {
                cargarPartidosAdmin()
            } else {
                alert('Acceso denegado: No tienes permisos de administrador.')
                window.location.href = 'index.html'
            }
        }

        window.crearPartido = async () => {
            const home = document.getElementById('new-home').value
            const away = document.getElementById('new-away').value
            const stage = document.getElementById('new-stage').value
            const date = document.getElementById('new-date').value

            const { error } = await supabase.from('matches').insert([
                { home_team: home, away_team: away, stage: stage, match_date: date }
            ])

            if (error) alert(error.message)
            else {
                alert('Partido creado')
                cargarPartidosAdmin()
            }
        }

        // 2. Cargar partidos
        async function cargarPartidosAdmin() {
            const { data: matches, error } = await supabase
                .from('matches')
                .select('*')
                .order('match_date', { ascending: true })
            
            if (error) {
                document.getElementById('admin-matches').innerHTML = "Error al cargar: " + error.message
                return
            }

            const container = document.getElementById('admin-matches')
            container.innerHTML = ''
            
            matches.forEach(m => {
                const div = document.createElement('div')
                div.className = 'match-card'
                div.innerHTML = `
                    <span>${m.home_team} vs ${m.away_team} (${m.stage})</span>
                    <div>
                        <input type="number" id="home-${m.id}" value="${m.home_score || 0}">
                        <input type="number" id="away-${m.id}" value="${m.away_score || 0}">
                        <button onclick="actualizarResultado(${m.id})">Guardar</button>
                    </div>
                `
                container.appendChild(div)
            })
        }

        // 3. Función para actualizar y calcular
        window.actualizarResultado = async (id) => {
            const home = document.getElementById(`home-${id}`).value
            const away = document.getElementById(`away-${id}`).value
            
            // A. Actualizar partido
            const { error: updateError } = await supabase.from('matches').update({ 
                home_score: parseInt(home), 
                away_score: parseInt(away), 
                status: 'finished' 
            }).eq('id', id)
            
            if (updateError) return alert('Error al actualizar: ' + updateError.message)

            // B. Llamar a la función SQL de cálculo
            const { error: rpcError } = await supabase.rpc('calcular_puntos_partido', { p_match_id: id })
            
            if (rpcError) {
                alert('Resultado guardado, pero falló el cálculo: ' + rpcError.message)
            } else {
                alert('Resultado guardado y puntos calculados exitosamente.')
                cargarPartidosAdmin()
            }
        }

        window.eliminarPartido = async (id) => {
            if (!confirm('¿Estás seguro de que quieres eliminar este partido y todos sus pronósticos?')) {
                return
            }

            // Eliminar pronósticos asociados primero (debido a la clave foránea)
            await supabase.from('predictions').delete().eq('match_id', id)

            // Eliminar el partido
            const { error } = await supabase.from('matches').delete().eq('id', id)
            if (error) alert('Error al eliminar el partido: ' + error.message)
            else cargarPartidosAdmin()
        }

        checkAdmin()
    </script>
</body>
</html>
