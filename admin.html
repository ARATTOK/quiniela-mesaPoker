        window.importarCalendarioFIFA = async () => {
            const apiKey = document.getElementById('api-key-sports').value;
            if (!apiKey) return alert("Por favor ingresa tu API Key de API-Sports");

            try {
                const response = await fetch('https://v3.football.api-sports.io/fixtures?league=1&season=2026', {
                    headers: { 'x-apisports-key': apiKey }
                });
                const data = await response.json();
                const fixtures = data.response;

                if (!fixtures || fixtures.length === 0) throw new Error("No se encontraron partidos");

                const partidosParaInsertar = fixtures.map(f => ({
                    home_team: f.teams.home.name,
                    away_team: f.teams.away.name,
                    match_date: f.fixture.date,
                    stage: f.league.round,
                    status: 'pending'
                }));

                // Insertar en Supabase
                const { error } = await supabase.from('matches').insert(partidosParaInsertar);

                if (error) throw error;
                alert(`${fixtures.length} partidos importados correctamente.`);
                cargarPartidosAdmin();
            } catch (err) {
                alert("Error: " + err.message);

                {"id": 57, "fecha": "2026-06-25", "grupo": "F", "home": "Japón", "away": "Suecia"},
                {"id": 58, "fecha": "2026-06-25", "grupo": "F", "home": "Túnez", "away": "Países Bajos"},
                {"id": 59, "fecha": "2026-06-25", "grupo": "D", "home": "Turquía", "away": "EE. UU."},
                {"id": 60, "fecha": "2026-06-25", "grupo": "D", "home": "Paraguay", "away": "Australia"},
                {"id": 61, "fecha": "2026-06-26", "grupo": "G", "home": "Bélgica", "away": "Nueva Zelanda"},
                {"id": 62, "fecha": "2026-06-26", "grupo": "G", "home": "RI de Irán", "away": "Egipto"},
                {"id": 63, "fecha": "2026-06-26", "grupo": "H", "home": "España", "away": "Uruguay"},
                {"id": 64, "fecha": "2026-06-26", "grupo": "H", "home": "Islas de Cabo Verde", "away": "Arabia Saudí"},
                {"id": 65, "fecha": "2026-06-26", "grupo": "I", "home": "Francia", "away": "Noruega"},
                {"id": 66, "fecha": "2026-06-26", "grupo": "I", "home": "Senegal", "away": "Irak"},
                {"id": 67, "fecha": "2026-06-27", "grupo": "L", "home": "Panamá", "away": "Inglaterra"},
                {"id": 68, "fecha": "2026-06-27", "grupo": "L", "home": "Croacia", "away": "Ghana"},
                {"id": 69, "fecha": "2026-06-27", "grupo": "J", "home": "Jordania", "away": "Argentina"},
                {"id": 70, "fecha": "2026-06-27", "grupo": "J", "home": "Argelia", "away": "Austria"},
                {"id": 71, "fecha": "2026-06-27", "grupo": "K", "home": "Colombia", "away": "Portugal"},
                {"id": 72, "fecha": "2026-06-27", "grupo": "K", "home": "RD Congo", "away": "Uzbekistán"}
            ];

            const matchesToInsert = partidos.map(p => ({
                home_team: p.home,
                away_team: p.away,
                match_date: p.fecha,
                stage: `Grupos - ${p.grupo}`,
                status: 'pending'
            }));

            const { error } = await supabase.from('matches').insert(matchesToInsert);
            if (error) alert("Error: " + error.message);
            else {
                alert(`${partidos.length} partidos del calendario oficial importados correctamente.`);
                cargarPartidosAdmin();
            }
        }

        window.updateMatchSelects = () => {
            const selects = document.querySelectorAll('.select-teams-list')
            selects.forEach(select => {
                const currentValue = select.value;
                select.innerHTML = '<option value="" disabled selected>Seleccionar país</option>'
                allTeams.forEach(t => {
                    const option = document.createElement('option')
                    option.value = t.name
                    option.textContent = getFlag(t.name)
                    select.appendChild(option)
                })
                if (currentValue) select.value = currentValue;
            })
        }

        window.importarEquiposMundial = async () => {
            if (!confirm('¿Deseas importar los 48 equipos del Mundial 2026? Esto podría duplicar equipos si ya existen.')) return;
            
            const mundialData = {
                "Grupo A": ["México", "Sudáfrica", "República de Corea", "Chequia"],
                "Grupo B": ["Canadá", "Bosnia y Herzegovina", "Catar", "Suiza"],
                "Grupo C": ["Brasil", "Marruecos", "Haití", "Escocia"],
                "Grupo D": ["EE. UU.", "Paraguay", "Australia", "Turquía"],
                "Grupo E": ["Alemania", "Curazao", "Costa de Marfil", "Ecuador"],
                "Grupo F": ["Países Bajos", "Japón", "Suecia", "Túnez"],
                "Grupo G": ["Bélgica", "Egipto", "RI de Irán", "Nueva Zelanda"],
                "Grupo H": ["España", "Islas de Cabo Verde", "Arabia Saudí", "Uruguay"],
                "Grupo I": ["Francia", "Senegal", "Irak", "Noruega"],
                "Grupo J": ["Argentina", "Argelia", "Austria", "Jordania"],
                "Grupo K": ["Portugal", "RD Congo", "Uzbekistán", "Colombia"],
                "Grupo L": ["Inglaterra", "Croacia", "Ghana", "Panamá"]
            };
            
            const teamsToInsert = [];
            for (const [grupo, paises] of Object.entries(mundialData)) {
                paises.forEach(pais => teamsToInsert.push({ name: pais, group_name: grupo }));
            }

            const { error } = await supabase.from('teams').insert(teamsToInsert);
            if (error) alert("Error: " + error.message);
            else { alert("Equipos importados exitosamente."); cargarEquipos(); }
        }

        window.crearEquipo = async () => {
            const name = document.getElementById('team-name').value.trim()
            const group = document.getElementById('team-group').value

            if (!name) return alert("Ingresa el nombre del país")

            const { error } = await supabase.from('teams').insert([{ name, group_name: group }])
            
            if (error) {
                alert("Error: " + error.message)
            } else {
                document.getElementById('team-name').value = ''
                cargarEquipos()
            }
        }

        window.eliminarEquipo = async (id) => {
            if (!confirm('¿Eliminar este equipo?')) return
            
            const { error } = await supabase.from('teams').delete().eq('id', id)
            if (error) {
                alert("No se puede eliminar: el equipo podría estar en un partido.")
            } else {
                cargarEquipos()
            }
        }

        window.limpiarFormularioPartido = () => {
            document.getElementById('new-home').value = ''
            document.getElementById('new-away').value = ''
            document.getElementById('new-stage').value = 'Grupos'
            document.getElementById('new-date').value = ''
        }

        window.crearPartido = async () => {
            const home = document.getElementById('new-home').value
            const away = document.getElementById('new-away').value
            const stage = document.getElementById('new-stage').value
            const date = document.getElementById('new-date').value

            const { error } = await supabase.from('matches').insert([
                { home_team: home, away_team: away, stage: stage, match_date: date }
            ])

            if (error) alert(error.message)
            else {
                alert('Partido creado')
                cargarPartidosAdmin()
            }
        }

        // 2. Cargar partidos
        async function cargarPartidosAdmin() {
            const { data: matches, error } = await supabase
                .from('matches')
                .select('*')
                .order('match_date', { ascending: true })
            
            if (error) {
                document.getElementById('admin-matches').innerHTML = "Error al cargar: " + error.message
                return
            }
            allMatches = matches;
            renderPartidosAdmin();
        }

        window.renderPartidosAdmin = () => {
            const filterStage = document.getElementById('filter-match-stage').value;
            const filterStatus = document.getElementById('filter-match-status').value;
            const filterSearch = document.getElementById('filter-match-search').value.toLowerCase();

            const filteredMatches = allMatches.filter(m => {
                const matchesStage = filterStage === 'todos' || m.stage === filterStage;
                const matchesStatus = filterStatus === 'todos' || m.status === filterStatus;
                const matchesSearch = m.home_team.toLowerCase().includes(filterSearch) || m.away_team.toLowerCase().includes(filterSearch);
                return matchesStage && matchesStatus && matchesSearch;
            });

            const container = document.getElementById('admin-matches')
            container.innerHTML = ''
            
            filteredMatches.forEach((m, index) => {
                const isFinished = m.status === 'finished'
                const isKnockout = ['Octavos', 'Cuartos', 'Semis', 'Final'].includes(m.stage)
                const div = document.createElement('div')
                div.className = `card bg-base-100 shadow-xl border-l-4 ${isFinished ? 'border-success' : 'border-warning'} animate-fade-in-up p-2 overflow-hidden`
                div.style.animationDelay = `${index * 0.05}s`
                
                const matchDate = new Date(m.match_date).toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' })

                div.innerHTML = `
                    <div class="card-body p-2 text-sm gap-1">
                        <div class="flex justify-between items-start">
                            <span class="badge badge-outline badge-xs opacity-70">${m.stage}</span>
                            <span class="text-[10px] opacity-50">${matchDate}</span>
                        </div>
                        <div class="text-center font-bold text-sm md:text-base my-1 truncate w-full" title="${m.home_team} vs ${m.away_team}">
                            ${getFlag(m.home_team)} vs ${getFlag(m.away_team)}
                        </div>
                        <div class="flex items-center gap-2 justify-center py-1">
                            <input type="number" id="home-${m.id}" value="${m.home_score ?? ''}" 
                                class="input input-bordered input-xs w-12 text-center font-bold" placeholder="0">
                            <span class="opacity-30">-</span>
                            <input type="number" id="away-${m.id}" value="${m.away_score ?? ''}" 
                                class="input input-bordered input-xs w-12 text-center font-bold" placeholder="0">
                        </div>
                        
                        ${isKnockout ? `
                        <select id="penalty-${m.id}" class="select select-bordered select-xs w-full mt-1">
                            <option value="">¿Quién clasifica?</option>
                            <option value="${m.home_team}" ${m.penalty_winner === m.home_team ? 'selected' : ''}>${getFlag(m.home_team)}</option>
                            <option value="${m.away_team}" ${m.penalty_winner === m.away_team ? 'selected' : ''}>${getFlag(m.away_team)}</option>
                        </select>` : ''}

                        <div class="card-actions justify-between items-center mt-2 border-t border-base-300 pt-2">
                            <button onclick="eliminarPartido(${m.id})" class="btn btn-ghost btn-xs text-error p-0">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                                </svg>
                            </button>
                            <div class="flex gap-1">
                                ${isFinished ? `
                                    <div class="badge badge-success badge-sm font-bold">FINALIZADO</div>
                                    <button onclick="reabrirPartido(${m.id})" class="btn btn-ghost btn-xs text-info px-1">Editar</button>
                                ` : `
                                    <button onclick="actualizarResultado(${m.id})" class="btn btn-primary btn-xs px-4">Guardar</button>
                                `}
                            </div>
                        </div>
                    </div>
                `
                container.appendChild(div)
            })
        }

        // 3. Función para actualizar y calcular
        window.actualizarResultado = async (id) => {
            const home = document.getElementById(`home-${id}`).value
            const away = document.getElementById(`away-${id}`).value
            const penalty = document.getElementById(`penalty-${id}`)?.value || null
            
            if (home === '' || away === '') return alert('Por favor, ingresa los goles.')

            // A. Actualizar partido
            const { error: updateError } = await supabase.from('matches').update({ 
                home_score: parseInt(home), 
                away_score: parseInt(away),
                penalty_winner: penalty,
                status: 'finished' 
            }).eq('id', id)
            
            if (updateError) return alert('Error al actualizar: ' + updateError.message)

            // B. Llamar a la función SQL de cálculo
            const { error: rpcError } = await supabase.rpc('calcular_puntos_partido', { p_match_id: id })
            
            if (rpcError) {
                alert('Resultado guardado, pero falló el cálculo: ' + rpcError.message)
            } else {
                alert('Resultado guardado y puntos calculados exitosamente.')
                cargarPartidosAdmin()
            }
        }

        window.reabrirPartido = async (id) => {
            const { error } = await supabase.from('matches').update({ status: 'pending' }).eq('id', id)
            if (error) alert(error.message)
            else cargarPartidosAdmin()
        }

        window.eliminarPartido = async (id) => {
            if (!confirm('¿Estás seguro de que quieres eliminar este partido y todos sus pronósticos?')) {
                return
            }

            // Eliminar pronósticos asociados primero (debido a la clave foránea)
            await supabase.from('predictions').delete().eq('match_id', id)

            // Eliminar el partido
            const { error } = await supabase.from('matches').delete().eq('id', id)
            if (error) alert('Error al eliminar el partido: ' + error.message)
            else cargarPartidosAdmin()
        }

        window.logout = async () => {
            await supabase.auth.signOut()
            localStorage.clear()
            window.location.href = 'index.html'
        }

        checkAdmin()
    </script>
</body>
</html>
