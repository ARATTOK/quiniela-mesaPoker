<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
    </script>
    <title>Quiniela - Pronósticos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤡</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }
    </style>
</head>
<body class="bg-base-200 min-h-screen">
    <div class="navbar bg-base-100 shadow-lg px-2 sm:px-4 lg:px-20 border-b border-primary/10">
        <div class="flex-1"><a href="index.html" onclick="playHorn()" class="text-lg sm:text-xl font-bold text-primary hover:text-secondary transition-colors duration-300">🤡 <span class="hidden sm:inline">Mesa Poker</span></a></div>
        <div class="flex-none flex items-center gap-1 sm:gap-2">
            <ul class="menu menu-horizontal px-0 sm:px-1 gap-0 sm:gap-2 text-xs sm:text-sm font-medium">
                <li><a href="pronosticos.html" class="active p-2 sm:p-4 hover:text-primary transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0 1 12 21 8.25 8.25 0 0 1 6.038 7.048 8.287 8.25 0 0 0 9 9.6a8.983 8.983 0 0 1 3.361-6.867 8.21 8.25 0 0 0 3 2.48Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M12 18a3.75 3.75 0 0 0 .495-7.467 5.99 5.99 0 0 0-1.925 3.546 5.974 5.974 0 0 1-2.133-1.001A3.75 3.75 0 0 0 12 18Z" /></svg>
                    <span class="hidden sm:inline">Pronósticos</span>
                </a></li>
                <li><a href="ranking.html" class="p-2 sm:p-4 hover:text-secondary transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" /></svg>
                    <span class="hidden sm:inline">Ranking</span>
                </a></li>
                <li><a href="reglamento.html" class="p-2 sm:p-4 hover:text-accent transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" /></svg>
                    <span class="hidden sm:inline">Reglas</span>
                </a></li>
            </ul>
            <label class="btn btn-ghost btn-circle btn-sm swap swap-rotate">
                <input type="checkbox" id="theme-toggle" />
                <svg class="swap-on fill-current w-5 h-5 text-yellow-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,17.05l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,18.36,17ZM12,8a4,4,0,1,0,4,4A4,4,0,0,0,12,8Z"/></svg>
                <svg class="swap-off fill-current w-5 h-5 text-indigo-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.91,0,0,1,.25-1A1,1,0,0,0,8,3.23,9,9,0,1,0,21.64,13Zm-9.5,6.69A7,7,0,1,1,14.63,6a9,9,0,0,0-1.3,4A8.15,8.15,0,0,0,21.37,18,7,7,0,0,1,12.14,19.69Z"/></svg>
            </label>
            <div class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="btn btn-ghost btn-sm italic opacity-70 lowercase">
                    <span id="user-display"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 opacity-50">
                        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
                    </svg>
                </div>
                <ul tabindex="0" class="dropdown-content z-[1] menu p-2 shadow bg-base-100 rounded-box w-52 mt-4">
                    <li><button onclick="logout()" class="text-error font-bold text-left">Cerrar Sesión</button></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="container mx-auto p-4 lg:p-10">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <h1 class="text-3xl font-bold border-l-4 border-primary pl-4 text-primary">Mis Pronósticos</h1>
            <div class="join shadow-sm border border-base-300">
                <input type="date" id="match-date-filter" class="input input-bordered join-item input-sm focus:input-primary" />
                <button class="btn btn-primary join-item btn-sm" onclick="resetFecha()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" /></svg>
                    Hoy
                </button>
            </div>
        </div>

        <!-- Podio Ideal Section -->
        <div id="podium-container" class="mb-10 hidden animate-fade-in-up">
            <div class="card bg-base-100 shadow-xl border border-warning/20">
                <div class="card-body p-6">
                    <h2 class="card-title text-warning flex items-center gap-2">
                        🏆 Podio Ideal
                        <div class="badge badge-warning badge-outline font-normal text-xs uppercase tracking-widest">+ Puntos Extra</div>
                    </h2>
                    <p class="text-sm opacity-70 mb-4">Selecciona tus predicciones para los tres mejores equipos del mundial.</p>
                    
                    <div id="podium-deadline-alert" class="alert alert-warning shadow-lg mb-6 py-3 border-2 border-warning/50 animate-pulse">
                        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                        <div class="flex flex-col sm:flex-row sm:items-center gap-3">
                            <span class="text-xs sm:text-sm font-bold uppercase tracking-tight">¡Importante! Tienes hasta el 14 de Junio para guardar tu podio.</span>
                            <span id="podium-timer" class="badge badge-neutral font-mono text-xs py-3 px-4">Calculando...</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="form-control">
                            <label class="label"><span class="label-text font-bold text-xs uppercase opacity-70">🥇 Campeón (20 pts)</span></label>
                            <select id="podium-1" class="select select-bordered select-warning w-full">
                                <option value="" disabled selected>Seleccionar...</option>
                            </select>
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text font-bold text-xs uppercase opacity-70">🥈 Subcampeón (10 pts)</span></label>
                            <select id="podium-2" class="select select-bordered select-secondary w-full">
                                <option value="" disabled selected>Seleccionar...</option>
                            </select>
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text font-bold text-xs uppercase opacity-70">🥉 Tercer puesto (6 pts)</span></label>
                            <select id="podium-3" class="select select-bordered select-accent w-full">
                                <option value="" disabled selected>Seleccionar...</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="card-actions justify-end mt-6">
                        <button id="save-podium" class="btn btn-warning btn-sm px-8 shadow-lg">
                            Guardar Podio
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="matches-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
            <!-- Cargado por JS -->
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
